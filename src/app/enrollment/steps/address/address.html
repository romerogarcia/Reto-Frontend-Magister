<app-step-page step="address" [formGroup]="form">
  <app-form-field
    label="Comunidad de examen"
    hint="(Selecciona una opción)"
    for="comunidad"
    [control]="form.controls.comunidad"
    [messages]="{ required: 'Selecciona una opción' }"
  >
    <select appControl id="comunidad" formControlName="comunidad">
      <option value="" disabled>Ej: Madrid</option>
      @for (comunidad of comunidades; track comunidad) {
        <option [value]="comunidad">{{ comunidad }}</option>
      }
    </select>
  </app-form-field>

  <app-form-field label="Dirección" for="address" [control]="form.controls.direccion">
    <input
      appControl
      id="address"
      type="text"
      autocomplete="street-address"
      formControlName="direccion"
      placeholder="Ej: Calle Ramiro de Maeztu, 10, 4D"
    />
  </app-form-field>

  <div class="l-grid l-grid--3">
    <app-form-field label="Localidad" for="locality" [control]="form.controls.localidad">
      <input
        appControl
        id="locality"
        type="text"
        autocomplete="address-level2"
        formControlName="localidad"
        placeholder="Ej: Madrid"
      />
    </app-form-field>

    <app-form-field label="Provincia" for="province" [control]="form.controls.provincia">
      <input
        appControl
        id="province"
        type="text"
        autocomplete="address-level1"
        formControlName="provincia"
        placeholder="Ej: Madrid"
      />
    </app-form-field>

    <app-form-field label="Código postal" for="cp" [control]="form.controls.cp">
      <input
        appControl
        id="cp"
        type="text"
        inputmode="numeric"
        autocomplete="postal-code"
        formControlName="cp"
        placeholder="Ej: 28405"
      />
    </app-form-field>
  </div>

  <div class="l-grid l-grid--2">
    <app-checkbox formControlName="aceptaLegal">
      Acepto la <em class="m-checkbox__highlight">información legal</em>
    </app-checkbox>
    <app-checkbox formControlName="aceptaPrivacidad">
      Acepto la <em class="m-checkbox__highlight">protección de datos</em>
    </app-checkbox>
  </div>
</app-step-page>
