<app-step-page step="modality" [formGroup]="form">
  <fieldset
    appFieldset
    legend="Modalidad"
    hint="(Selecciona una opción)"
    [control]="form.controls.modalidad"
  >
    <app-choice-group formControlName="modalidad" layout="grid" [options]="modalidadOptions" />
  </fieldset>

  <fieldset appFieldset legend="Horario" hint="(Selecciona una opción)" formArrayName="horarios">
    <div class="l-grid">
      @for (control of form.controls.horarios.controls; track $index; let i = $index) {
        <app-form-field [label]="'Horario, opción ' + (i + 1)" [for]="'horario-' + i" hideLabel>
          <select appControl [id]="'horario-' + i" [formControlName]="i">
            @for (horario of horarios; track horario) {
              <option [value]="horario">{{ horario }}</option>
            }
          </select>
        </app-form-field>
      }
    </div>
  </fieldset>
</app-step-page>
