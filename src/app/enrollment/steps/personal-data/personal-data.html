<app-step-page step="personalData" [formGroup]="form">
  <app-form-field
    label="Nombre completo"
    for="name"
    [control]="form.controls.nombre"
    [messages]="{ minlength: 'Escribe tu nombre completo' }"
  >
    <input
      appControl
      id="name"
      type="text"
      autocomplete="name"
      formControlName="nombre"
      placeholder="Ej: May García Sánchez"
    />
  </app-form-field>

  <div class="l-grid l-grid--3">
    <app-form-field label="DNI - NIE" for="dni" [control]="form.controls.dni">
      <input appControl id="dni" type="text" formControlName="dni" placeholder="Ej: Y5674859P" />
    </app-form-field>

    <app-form-field label="Móvil" for="phone" [control]="form.controls.movil">
      <input
        appControl
        id="phone"
        type="tel"
        autocomplete="tel"
        formControlName="movil"
        placeholder="Ej: 605 45 32 97"
      />
    </app-form-field>

    <app-form-field label="Email" for="email" [control]="form.controls.email">
      <input
        appControl
        id="email"
        type="email"
        autocomplete="email"
        formControlName="email"
        placeholder="Ej: maygarcia@gmail.com"
      />
    </app-form-field>
  </div>
</app-step-page>
