<main class="landing">
  <nav class="menu-burguer" aria-label="Menú">
    <i class="fa-solid fa-bars fa-4x" aria-hidden="true"></i>
  </nav>
  <section class="section">
    <div class="section__elements">
      <i class="fa-solid fa-landmark fa-4x" aria-hidden="true"></i>
      <h1 class="section__elements__title">Magister</h1>
    </div>
    <p class="section__subtitle">¡Gracias{{ firstName() ? ', ' + firstName() : '' }}!</p>
    <p class="section__subtitle">Tu reserva esta en proceso</p>
    <p class="section__text">
      La matrícula solo será efectiva una vez se haya recibido el Pago por Tarjeta o Transferencia
    </p>

    <button type="button" class="section__button" (click)="goHome()">
      <span class="section__button__link">Vuelve a Home</span>
    </button>
    <p class="section__back">
      <a class="section__back" routerLink="/payment">Volver atrás</a>
    </p>
  </section>
</main>
