<div class="Landing">
  <main class="landing">
    <nav class="menu-burguer" aria-label="Menú">
      <i class="fa-solid fa-bars fa-4x" aria-hidden="true"></i>
    </nav>
    <section class="section">
      <div class="section__elements">
        <i class="fa-solid fa-landmark fa-4x" aria-hidden="true"></i>
        <h1 class="section__elements__title">Magister</h1>
      </div>
      <p class="section__subtitle">¡Comencemos con tu matrícula!</p>
      <p class="section__text">
        Para comenzar a especializarte, vamos a realizar unas preguntas para darte el mejor servicio
      </p>

      <button type="button" class="section__button" (click)="start()">
        <span class="section__button__link">Comenzar</span>
      </button>
      <p class="section__back">Volver atrás</p>
    </section>
  </main>
</div>
