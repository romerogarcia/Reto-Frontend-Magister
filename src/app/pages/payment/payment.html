<main>
  <section appStepsSidebar [current]="5"></section>

  <section class="section2-final">
    <nav class="section2__menu" aria-label="Menú">
      <i class="fa-solid fa-bars fa-4x" aria-hidden="true"></i>
    </nav>
    <h2 class="section2-final__title">Forma de pago</h2>
    <h3 class="section2__container-alum__title">
      ¿Cómo prefieres abonar tu primer pago?
      <app-field-error
        [control]="form.controls.metodo"
        [messages]="{ required: 'Selecciona una opción' }"
      />
    </h3>

    <div class="section2-final__container" role="radiogroup" aria-label="Forma de pago">
      @for (metodo of metodos; track metodo.value) {
        <button
          type="button"
          role="radio"
          class="section2-final__container__box"
          [class.is-selected]="form.controls.metodo.value === metodo.value"
          [attr.aria-checked]="form.controls.metodo.value === metodo.value"
          (click)="chooseMetodo(metodo.value)"
        >
          {{ metodo.label }}
        </button>
      }
    </div>

    <p class="section2-final__container-alum__text">
      Detalles sobre forma de pago y proceso post pago
      <i class="fa-solid fa-arrow-right fa-lg" aria-hidden="true"></i>
    </p>

    <h3 class="section2-final__container-alum__title">
      ¿Vienes recomendado por alguien?
      <app-field-error
        [control]="form.controls.recomendado"
        [messages]="{ required: 'Selecciona una opción' }"
      />
    </h3>
    <div role="radiogroup" aria-label="¿Vienes recomendado por alguien?" style="display: contents">
      <button
        type="button"
        role="radio"
        class="section2__container-b__button"
        [class.is-selected]="form.controls.recomendado.value === false"
        [attr.aria-checked]="form.controls.recomendado.value === false"
        (click)="chooseRecomendado(false)"
      >
        No
      </button>
      <button
        type="button"
        role="radio"
        class="section2__container-b__button"
        [class.is-selected]="form.controls.recomendado.value === true"
        [attr.aria-checked]="form.controls.recomendado.value === true"
        (click)="chooseRecomendado(true)"
      >
        Si
      </button>
    </div>

    <p class="section2-final__container-alum__text">
      Ver información legal
      <i class="fa-solid fa-arrow-right fa-lg" aria-hidden="true"></i>
    </p>

    <button type="button" class="button-send" (click)="send()">
      <span class="button-send__link">Enviar</span>
    </button>
    <p class="section__back">
      <a class="section__back" routerLink="/address">Volver atrás</a>
    </p>
  </section>
</main>
