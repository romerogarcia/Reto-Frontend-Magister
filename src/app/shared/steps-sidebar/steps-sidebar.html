<div class="{{ block() }}__elements">
  <i class="fa-solid fa-landmark fa-4x" aria-hidden="true"></i>
  <h1 class="{{ block() }}__elements__title">Magister</h1>
</div>

<nav class="{{ block() }}__container-task" aria-label="Pasos de la matrícula">
  @for (item of steps; track item.key; let i = $index) {
    @if (i === current()) {
      <div class="{{ block() }}__container-task__newcolor">
        <p class="{{ block() }}__container-task__newcolor" aria-current="step">
          <i class="fa-regular fa-circle fa-lg" aria-hidden="true"></i>{{ item.label }}
        </p>
      </div>
    } @else {
      <p class="{{ block() }}__container-task__list">
        <i class="fa-solid fa-circle fa-lg" aria-hidden="true"></i>{{ item.label }}
      </p>
    }
  }
</nav>

<section>
  <img alt="Ilustración de una persona" class="{{ step().imageClass }}" [src]="step().image" />
</section>
